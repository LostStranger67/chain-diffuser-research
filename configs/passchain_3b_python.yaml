# 3.0B total / ~400M routed-active Python-specialized PassChain-40.
model:
  layout: passchain_3b
  vocab_size: 49152
  mask_token_id: 16
  d_model: 1536
  n_layers: 16
  n_heads: 12
  n_kv_heads: 4
  head_dim: 128
  d_ff_dense: 6144
  moe_first_layer: 1
  d_ff_expert: 960
  top_k: 6
  experts_per_phase: 16
  n_phases: 4
  block_size: 64
  n_blocks: 32          # 2048-token sequence-packed blocks
  qk_norm: true
  z_loss_weight: 0.0001
  fp8: true
  tie_embeddings: true
  moe_impl: grouped

data:
  # Sequence-packed uint16 shards with <|endoftext|> document boundaries.
  shards_dir: /data/python_mix
  sequence_packing: true
  seq_len: 2048
  eos_token_id: 0
  deduplicate_python: true
  mix:
    python: 0.70          # The Stack v2 / StarCoderData, deduplicated
    fineweb_edu: 0.20
    openmath: 0.10
  synthetic: false

training:
  total_tokens: 17000000000
  global_batch_seqs: 512
  micro_batch: 8
  lm_chunk_tokens: 4096
  lr_muon: 0.02
  lr_adamw: 0.0003
  weight_decay: 0.1
  grad_clip: 1.0
  muon_momentum: 0.95
  muon_ns_steps: 5
  warmup_frac: 0.02
  decay_frac: 0.15
  phase: stable
  compile: true
  seed: 42
  log_interval: 10
  save_every_minutes: 30
  save_every_steps: 0
  out_dir: runs/passchain_3b
  hf_repo_id: LostStranger67/chain-diffuser
